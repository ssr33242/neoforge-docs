name: Синхронизация с оригиналом

# Зеркало официальной документации: подтягиваем изменения из upstream.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Подключить upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/neoforged/Documentation.git
          git fetch upstream --prune --tags

      - name: Fast-forward на коммит upstream
        run: |
          git checkout main
          if git merge --ff-only upstream/main; then
            echo "Слито fast-forward."
          else
            echo "История разошлась — приводим к состоянию upstream."
            git reset --hard upstream/main
          fi

      - name: Отправить
        run: |
          if git diff --quiet HEAD origin/main; then
            echo "Изменений нет — пушить нечего."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force-with-lease origin main

      - name: Обновить дату синхронизации в README
        if: success()
        run: |
          date -u +%Y-%m-%d > .sync-date
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sync-date
          git commit -m "chore: синхронизация с upstream ($(date -u +%Y-%m-%d))" || echo "нечего коммитить"
          git push origin main
